name: Compilar APK Yo Freelancer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Analysis & Tests
        run: |
          flutter analyze
          flutter test

      - name: Build Android Release APK (Sandbox Mode)
        run: flutter build apk --release --dart-define=PAYMENT_SANDBOX=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoFreelancer-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
